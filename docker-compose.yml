services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SUPPLYSHIELD_CORS_ORIGINS: ${SUPPLYSHIELD_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
